<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNOPTIMIZED - Opticraft Fork</title>
  <style>
    @font-face {
      font-family: 'Minecraft';
      src: url('Minecraft.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111111;
      background-image: 
        url('bg.png'),
        radial-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px);
      background-repeat: repeat;
      image-rendering: pixelated;
      color: #e0e0e0;
      font-family: 'Minecraft', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    /* Top bar & Lang Switcher */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .lang-selector {
      background-color: #222;
      border: 2px solid #555;
      color: #fff;
      font-family: 'Minecraft', monospace;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
    }

    .lang-selector:hover {
      border-color: #aaa;
      background-color: #333;
    }

    /* Header & Logo */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-container {
      display: inline-block;
      max-width: 100%;
    }

    .logo-img {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    /* Panel Base */
    .lce-panel {
      background-color: #1a1a1a;
      border: 4px solid #3c3c3c;
      box-shadow: inset -4px -4px 0px #101010, inset 4px 4px 0px #555555;
      padding: 20px;
      margin-bottom: 25px;
    }

    .panel-title {
      color: #ffff55;
      font-size: 20px;
      margin-bottom: 15px;
      text-shadow: 2px 2px 0px #3f3f00;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }

    /* Feature List */
    .feature-list {
      list-style-type: none;
    }

    .feature-item {
      position: relative;
      padding-left: 24px;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.4;
      color: #ddd;
    }

    .feature-item::before {
      content: '>';
      position: absolute;
      left: 0;
      color: #55ff55;
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <select id="langSelect" class="lang-selector" onchange="changeLanguage(this.value)">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>

    </div>

    <header>

    <footer>
      Opticraft Fork &bull; Lynoptimized LCE

    function changeLanguage(lang) {
      const data = translations[lang] || translations.fr;
      
      document.getElementById('title-version').textContent = data.versionTitle;

      const listContainer = document.getElementById('list-working');
      listContainer.innerHTML = '';
      
      data.features.forEach(item => {
        const li = document.createElement('li');
        li.className = 'feature-item';
        li.textContent = item;
        listContainer.appendChild(li);
      });
    }

    // Initialisation
    changeLanguage('fr');
