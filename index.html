<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LYNOPTIMIZED - Opticraft Fork</title>
  <style>
    @font-face {
      font-family: 'Minecraft';
      src: url('Minecraft.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #111111;
      background-image: 
        url('bg.png'),
        radial-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.2) 2px, rgba(0,0,0,0.2) 4px);
      background-repeat: repeat;
      image-rendering: pixelated;
      color: #e0e0e0;
      font-family: 'Minecraft', 'Courier New', monospace;
      letter-spacing: 1px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    /* Top bar & Controls */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .lang-selector, .theme-toggle, .discord-btn {
      background-color: #222;
      border: 2px solid #555;
      color: #fff;
      font-family: 'Minecraft', monospace;
      letter-spacing: 1px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
      outline: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      border-radius: 2px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .discord-btn {
      background-color: #222;
      border: 2px solid #5865F2;
      color: #fff;
    }

    .discord-btn:hover {
      background-color: #5865F2;
      border-color: #7983f5;
    }

    .theme-icon, .discord-icon {
      width: 16px;
      height: 16px;
      image-rendering: pixelated;
      object-fit: contain;
    }

    .lang-selector:hover, .theme-toggle:hover {
      border-color: #aaa;
      background-color: #333;
    }

    /* Light Theme (Mode Jour) Overrides */
    body.light-mode {
      background-color: #c6c6c6;
      background-image: 
        url('bg_day.png'),
        url('bg.png'),
        radial-gradient(rgba(255,255,255,0.4), rgba(180,180,180,0.8));
      color: #111111;
    }

    body.light-mode .lang-selector, 
    body.light-mode .theme-toggle {
      background-color: #e0e0e0;
      border-color: #8b8b8b;
      color: #000;
    }

    body.light-mode .discord-btn {
      background-color: #5865F2;
      border-color: #404EED;
      color: #ffffff;
    }

    body.light-mode .discord-btn:hover {
      background-color: #404EED;
      border-color: #2c38b8;
    }

    body.light-mode .lang-selector:hover, 
    body.light-mode .theme-toggle:hover {
      background-color: #ffffff;
      border-color: #333;
    }

    body.light-mode .lce-panel {
      background-color: #c6c6c6;
      border: 4px solid #ffffff;
      box-shadow: inset -4px -4px 0px #555555, inset 4px 4px 0px #ffffff;
    }

    body.light-mode .panel-header {
      border-bottom: 2px solid #8b8b8b;
    }

    body.light-mode .panel-title,
    body.light-mode .toggle-icon {
      color: #2a2a00;
      text-shadow: 1px 1px 0px #ffffff;
    }

    body.light-mode .panel-header:hover .panel-title {
      color: #000000;
    }

    body.light-mode .feature-item {
      color: #111;
    }

    body.light-mode .feature-item::before {
      color: #00aa00;
    }

    body.light-mode footer {
      color: #444;
    }

    /* Fallback typographique pour le Russe */
    body.lang-ru,
    body.lang-ru .lang-selector,
    body.lang-ru .theme-toggle,
    body.lang-ru .discord-btn,
    body.lang-ru .panel-title,
    body.lang-ru .feature-item {
      font-family: Arial, Helvetica, sans-serif !important;
    }

    /* Header & Logo */
    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-container {
      display: inline-block;
      max-width: 100%;
    }

    .logo-img {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
    }

    /* Panel LCE Base */
    .lce-panel {
      background-color: #1a1a1a;
      border: 4px solid #3c3c3c;
      box-shadow: inset -4px -4px 0px #101010, inset 4px 4px 0px #555555;
      padding: 20px;
      margin-bottom: 25px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      border-bottom: 2px solid #333;
      padding-bottom: 8px;
    }

    .panel-header:hover .panel-title {
      color: #ffffff;
    }

    .panel-title {
      color: #ffff55;
      font-size: 20px;
      letter-spacing: 1.5px;
      text-shadow: 2px 2px 0px #3f3f00;
      transition: color 0.15s ease;
    }

    .toggle-icon {
      color: #ffff55;
      font-size: 16px;
      text-shadow: 2px 2px 0px #3f3f00;
    }

    /* Content Collapsible Wrapper */
    .panel-content {
      margin-top: 15px;
      display: block;
    }

    .panel-content.collapsed {
      display: none;
    }

    /* Feature List */
    .feature-list {
      list-style-type: none;
    }

    .feature-item {
      position: relative;
      padding-left: 24px;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.4;
      color: #ddd;
      letter-spacing: 0.8px;
    }

    .feature-item::before {
      content: '>';
      position: absolute;
      left: 0;
      color: #55ff55;
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      color: #555;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <a href="https://discord.com/users/murazelyne" target="_blank" class="discord-btn" title="Discord: murazelyne">
        <img src="discord.png" alt="Discord" class="discord-icon" onerror="this.style.display='none'">
        <span id="discordLabel">Demander et l'avoir</span>
      </a>
      <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()">
        <img id="themeIcon" src="moon.png" alt="Mode Nuit" class="theme-icon" onerror="this.style.display='none'">
        <span id="themeLabel">Nuit</span>
      </button>
      <select id="langSelect" class="lang-selector" onchange="changeLanguage(this.value)">
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="ru">Русский</option>
      </select>
    </div>

    <header>
      <div class="logo-container">
        <img src="model.png" alt="LYNOPTIMIZED Logo" class="logo-img" onerror="this.alt='LYNOPTIMIZED'">
      </div>
    </header>

    <main>
      <div class="lce-panel">
        <div class="panel-header" onclick="togglePanel()">
          <h2 class="panel-title" id="title-version">VERSION V40250</h2>
          <span class="toggle-icon" id="toggle-icon">▼</span>
        </div>
        <div class="panel-content" id="panel-content">
          <ul class="feature-list" id="list-working">
            <!-- Dynamic elements loaded via JS -->
          </ul>
        </div>
      </div>
    </main>

    <footer>
      Opticraft Fork &bull; Lynoptimized LCE
    </footer>
  </div>

    let currentLang = 'fr';

    function changeLanguage(lang) {
      currentLang = lang;
      const data = translations[lang] || translations.fr;
      
      if (lang === 'ru') {
        document.body.classList.add('lang-ru');
      } else {
        document.body.classList.remove('lang-ru');
      }

      document.getElementById('title-version').textContent = data.versionTitle;
      document.getElementById('discordLabel').textContent = data.discordBtn;

      // Update theme text according to current theme state & language
      const isLight = document.body.classList.contains('light-mode');
      document.getElementById('themeLabel').textContent = isLight ? data.themeDay : data.themeNight;

      const listContainer = document.getElementById('list-working');
      listContainer.innerHTML = '';
      
      data.features.forEach(item => {
        const li = document.createElement('li');
        li.className = 'feature-item';
        li.textContent = item;
        listContainer.appendChild(li);
      });
    }

    function togglePanel() {
      const content = document.getElementById('panel-content');
      const icon = document.getElementById('toggle-icon');
      
      content.classList.toggle('collapsed');
      icon.textContent = content.classList.contains('collapsed') ? '▲' : '▼';
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      const btnLabel = document.getElementById('themeLabel');
      const btnIcon = document.getElementById('themeIcon');
      const data = translations[currentLang] || translations.fr;

      if (isLight) {
        btnIcon.src = 'sun.png';
        btnIcon.alt = 'Mode Jour';
        btnLabel.textContent = data.themeDay;
      } else {
        btnIcon.src = 'moon.png';
        btnIcon.alt = 'Mode Nuit';
        btnLabel.textContent = data.themeNight;
      }
    }

    // Init
    changeLanguage('fr');
  </script>

</html>
